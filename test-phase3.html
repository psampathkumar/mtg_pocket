<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 3 Refactoring Tests</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .controls {
      padding: 20px 30px;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    
    .summary {
      padding: 20px 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    
    .stat-card {
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-card.total { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .stat-card.passed { background: #d4edda; color: #155724; }
    .stat-card.failed { background: #f8d7da; color: #721c24; }
    
    .stat-card .number { font-size: 3rem; font-weight: bold; margin: 0; }
    .stat-card .label { font-size: 0.9rem; opacity: 0.8; margin-top: 5px; }
    
    .results {
      padding: 0 30px 30px 30px;
    }
    
    .test-group {
      margin-bottom: 30px;
    }
    
    .test-group h2 {
      font-size: 1.3rem;
      margin: 0 0 15px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #e9ecef;
      color: #495057;
    }
    
    .test-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    
    .test-item.passed { background: #d4edda; border-left: 4px solid #28a745; }
    .test-item.failed { background: #f8d7da; border-left: 4px solid #dc3545; }
    
    .test-icon { font-size: 1.2rem; min-width: 24px; }
    .test-name { flex: 1; font-weight: 500; }
    .test-error {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #721c24;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 Phase 3 Refactoring Tests</h1>
      <p>Testing pack-opening.js → 2 Modules Split</p>
    </header>
    
    <div class="controls">
      <button class="btn-primary" id="runAll">▶️ Run All Tests</button>
    </div>
    
    <div class="summary" id="summary">
      <div class="stat-card total">
        <div class="number" id="total">0</div>
        <div class="label">Total Tests</div>
      </div>
      <div class="stat-card passed">
        <div class="number" id="passed">0</div>
        <div class="label">Passed</div>
      </div>
      <div class="stat-card failed">
        <div class="number" id="failed">0</div>
        <div class="label">Failed</div>
      </div>
    </div>
    
    <div class="results" id="results"></div>
  </div>

  <script type="module">
    // ===== TEST SUITE FRAMEWORK =====
    
    class TestSuite {
      constructor() {
        this.groups = [];
        this.results = { total: 0, passed: 0, failed: 0 };
      }
      
      group(name, tests) {
        this.groups.push({ name, tests });
      }
      
      test(name, fn) {
        return { name, fn };
      }
      
      async runAll() {
        this.results = { total: 0, passed: 0, failed: 0 };
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';
        
        for (const group of this.groups) {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'test-group';
          groupDiv.innerHTML = `<h2>${group.name}</h2>`;
          resultsDiv.appendChild(groupDiv);
          
          for (const test of group.tests) {
            this.results.total++;
            const testDiv = document.createElement('div');
            testDiv.className = 'test-item';
            
            try {
              await test.fn();
              this.results.passed++;
              testDiv.classList.add('passed');
              testDiv.innerHTML = `
                <span class="test-icon">✅</span>
                <span class="test-name">${test.name}</span>
              `;
            } catch (error) {
              this.results.failed++;
              testDiv.classList.add('failed');
              testDiv.innerHTML = `
                <span class="test-icon">❌</span>
                <span class="test-name">${test.name}</span>
              `;
              const errorDiv = document.createElement('div');
              errorDiv.className = 'test-error';
              errorDiv.textContent = error.message || error;
              testDiv.appendChild(errorDiv);
            }
            
            groupDiv.appendChild(testDiv);
          }
        }
        
        this.updateSummary();
      }
      
      updateSummary() {
        document.getElementById('total').textContent = this.results.total;
        document.getElementById('passed').textContent = this.results.passed;
        document.getElementById('failed').textContent = this.results.failed;
      }
    }
    
    const suite = new TestSuite();
    
    // ===== PACK GENERATOR TESTS =====
    
    suite.group('Pack Generator Module', [
      suite.test('generatePack() exports', async () => {
        const { generatePack } = await import('./js/game-logic/pack-generator.js');
        if (typeof generatePack !== 'function') throw new Error('Not exported');
      }),
      
      suite.test('generateGodPack() returns 5 cards', async () => {
        const { generateGodPack } = await import('./js/game-logic/pack-generator.js');
        const pools = { 
          fullArt: [
            { id: 'card1', name: 'Test 1', rarity: 'rare', collector_number: '1' },
            { id: 'card2', name: 'Test 2', rarity: 'rare', collector_number: '2' }
          ],
          spotlight: []
        };
        const pack = generateGodPack('TST', pools);
        if (pack.length !== 5) throw new Error(`Expected 5 cards, got ${pack.length}`);
      }),
      
      suite.test('generateRegularPack() returns at least 5 cards', async () => {
        const { generateRegularPack } = await import('./js/game-logic/pack-generator.js');
        const pools = {
          all: [
            { id: 'c1', rarity: 'common', collector_number: '1' },
            { id: 'c2', rarity: 'uncommon', collector_number: '2' },
            { id: 'c3', rarity: 'rare', collector_number: '3' }
          ],
          fullArt: [],
          masterpiece: [],
          spotlight: []
        };
        const pack = generateRegularPack('TST', pools);
        if (pack.length < 5) throw new Error(`Expected at least 5 cards, got ${pack.length}`);
      }),
      
      suite.test('selectRandomCard() falls back to other rarities', async () => {
        const { selectRandomCard } = await import('./js/game-logic/pack-generator.js');
        const cards = [{ id: 'c1', rarity: 'common' }];
        const result = selectRandomCard(cards, 'mythic'); // No mythics available
        if (result.rarity !== 'common') throw new Error('Fallback failed');
      }),
      
      suite.test('createCardData() returns valid structure', async () => {
        const { createCardData } = await import('./js/game-logic/pack-generator.js');
        const card = { 
          id: 'test', 
          name: 'Test Card', 
          rarity: 'rare',
          collector_number: '42',
          image_uris: { normal: 'front.jpg' }
        };
        const pools = { spotlight: [] };
        const data = createCardData(card, pools, { fullart: false });
        if (!data.name) throw new Error('Missing name');
        if (!data.rarity) throw new Error('Missing rarity');
        if (!data.img) throw new Error('Missing img');
      }),
      
      suite.test('validateCardPools() validates correctly', async () => {
        const { validateCardPools } = await import('./js/game-logic/pack-generator.js');
        const valid = { all: [{}], fullArt: [], masterpiece: [], spotlight: [] };
        const invalid = { all: [] };
        if (!validateCardPools(valid)) throw new Error('Valid pools rejected');
        if (validateCardPools(invalid)) throw new Error('Invalid pools accepted');
      }),
      
      suite.test('calculatePackStats() returns correct stats', async () => {
        const { calculatePackStats } = await import('./js/game-logic/pack-generator.js');
        const pack = [
          { cardData: { rarity: 'common' }, isBonus: false, isSecret: false },
          { cardData: { rarity: 'rare' }, isBonus: true, isSecret: false }
        ];
        const stats = calculatePackStats(pack);
        if (stats.totalCards !== 2) throw new Error('Wrong total');
        if (stats.bonusCards !== 1) throw new Error('Wrong bonus count');
      }),
    ]);
    
    // ===== PACK OPENER TESTS =====
    
    suite.group('Pack Opener Module', [
      suite.test('canOpenPack() exports', async () => {
        const { canOpenPack } = await import('./js/game-logic/pack-opener.js');
        if (typeof canOpenPack !== 'function') throw new Error('Not exported');
      }),
      
      suite.test('canOpenPack() works in free mode', async () => {
        const { canOpenPack } = await import('./js/game-logic/pack-opener.js');
        const result = canOpenPack(true);
        if (result !== true) throw new Error('Free mode should always allow');
      }),
      
      suite.test('processPackCards() exports', async () => {
        const { processPackCards } = await import('./js/game-logic/pack-opener.js');
        if (typeof processPackCards !== 'function') throw new Error('Not exported');
      }),
      
      suite.test('isCardOwned() exports', async () => {
        const { isCardOwned } = await import('./js/game-logic/pack-opener.js');
        if (typeof isCardOwned !== 'function') throw new Error('Not exported');
      }),
      
      suite.test('getPackOpeningStats() returns stats', async () => {
        const { getPackOpeningStats } = await import('./js/game-logic/pack-opener.js');
        const stats = getPackOpeningStats(false);
        if (typeof stats.canOpen !== 'boolean') throw new Error('Missing canOpen');
        if (typeof stats.currentPoints !== 'number') throw new Error('Missing currentPoints');
      }),
    ]);
    
    // ===== BACKWARDS COMPATIBILITY TESTS =====
    
    suite.group('Backwards Compatibility (pack-opening.js)', [
      suite.test('pack-opening.js re-exports canOpenPack', async () => {
        const { canOpenPack } = await import('./js/pack-opening.js');
        if (typeof canOpenPack !== 'function') throw new Error('Not re-exported');
      }),
      
      suite.test('pack-opening.js re-exports openPack', async () => {
        const { openPack } = await import('./js/pack-opening.js');
        if (typeof openPack !== 'function') throw new Error('Not re-exported');
      }),
      
      suite.test('pack-opening.js re-exports generatePack', async () => {
        const { generatePack } = await import('./js/pack-opening.js');
        if (typeof generatePack !== 'function') throw new Error('Not re-exported');
      }),
      
      suite.test('pack-opening.js re-exports generateGodPack', async () => {
        const { generateGodPack } = await import('./js/pack-opening.js');
        if (typeof generateGodPack !== 'function') throw new Error('Not re-exported');
      }),
      
      suite.test('pack-opening.js re-exports selectRandomCard', async () => {
        const { selectRandomCard } = await import('./js/pack-opening.js');
        if (typeof selectRandomCard !== 'function') throw new Error('Not re-exported');
      }),
      
      suite.test('pack-opening.js re-exports validateCardPools', async () => {
        const { validateCardPools } = await import('./js/pack-opening.js');
        if (typeof validateCardPools !== 'function') throw new Error('Not re-exported');
      }),
    ]);
    
    // ===== EVENT HANDLERS =====
    
    document.getElementById('runAll').onclick = () => suite.runAll();
    
    // Auto-run on load
    setTimeout(() => suite.runAll(), 500);
  </script>
</body>
</html>
